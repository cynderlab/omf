[project]
name = "omf"
version = "0.1.0"
description = "OH MY FIREWALL — read-only multi-vendor firewall audit agent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-ai>=0.4",
  "httpx>=0.28",
  "rich>=13.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.scripts]
omf = "omf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omf"]

[tool.hatch.build]
include = ["src/omf/**/*.yaml"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: optional live firewall tests (not CI)"]
