[project]
name = "omf"
version = "1.0.1"
description = "OH MY FORTRESS — read-only multi-vendor configuration audit agent"
authors = [{ name = "Pere Casas", email = "pcasas@cynderlab.com" }]
license = "Elastic-2.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13",
  "pydantic-ai>=2.31.1",
  "httpx>=0.28",
  "rich>=15.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.2",
  "questionary>=2.1.1",
]

[project.scripts]
omf = "omf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omf"]

[tool.hatch.build]
include = ["src/omf/**/*.yaml"]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: optional live target tests (not CI)"]
