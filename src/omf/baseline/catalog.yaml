checks:
  - id: FW-ADM-001
    title: Default admin username
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [users]
    evaluator: no_generic_accounts
    params:
      default:
        names: [admin, administrator, root]
      mikrotik:
        names: [admin]
        mode: must_not_exist
      fortinet:
        names: [admin]
        mode: must_be_renamed
    mitigation:
      generic: "Replace factory-default admin identities with unique named accounts."
      mikrotik: "Rename the default admin user under /user so the name is no longer admin."
      fortinet: |
        Replace the factory admin account. Create another super_admin first. You cannot delete the account you are logged in as.
        config system admin
            delete "admin"
        end
  - id: FW-ADM-002
    title: Admin idle timeout
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings, users]
    evaluator: idle_timeout_set
    params:
      default: {}
      mikrotik:
        mode: per_user
        policies: [logout, lockscreen, lock]
      fortinet:
        max_seconds: 900
    mitigation:
      generic: "Configure a non-zero administrative idle timeout."
      mikrotik: |
        Set inactivity timeout and policy on every user (logout or lockscreen).
        /user/set [find] inactivity-timeout=10m inactivity-policy=logout
      fortinet: |
        Set administrative idle timeout to 15 minutes or less (CIS example uses 5).
        config system global
            set admintimeout 5
        end
  - id: FW-ADM-003
    title: Device identity
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings]
    evaluator: hostname_not_default
    params:
      default: {}
    mitigation:
      generic: "Set a unique hostname that identifies the device and site."
      fortinet: |
        Set a unique hostname that identifies the device and site.
        config system global
            set hostname <hostname>
        end
  - id: FW-ADM-004
    title: Pre-login banner
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: banner_enabled
    params:
      default:
        field: pre_login_banner
    mitigation:
      generic: "Enable a pre-login legal banner on the administrative login page."
      fortinet: |
        Enable a pre-login legal banner. Edit the replacement message so it is a warning, not a welcome.
        config system global
            set pre-login-banner enable
        end
  - id: FW-ADM-005
    title: Post-login banner
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: banner_enabled
    params:
      default:
        field: post_login_banner
    mitigation:
      generic: "Enable a post-login banner that the administrator must acknowledge."
      fortinet: |
        Enable a post-login banner that the administrator must acknowledge.
        config system global
            set post-login-banner enable
        end
  - id: FW-ADM-006
    title: Timezone
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings]
    evaluator: timezone_set
    params:
      default: {}
    mitigation:
      generic: "Set the device timezone to the site local zone so logs and certificates line up."
      fortinet: |
        Set the device timezone to the site local zone id.
        config system global
            set timezone <id>
        end
      mikrotik: |
        Set the device timezone to the site local zone.
        /system clock/set time-zone-name=<timezone>
  - id: FW-ADM-007
    title: Management GUI TLS versions
    severity: high
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: tls_versions_allowed
    params:
      default:
        allowed: [tlsv1-3]
    mitigation:
      generic: "Restrict the administrative HTTPS listener to TLS 1.3."
      fortinet: |
        Restrict the administrative HTTPS listener to TLS 1.3.
        config system global
            set admin-https-ssl-versions tlsv1-3
        end
  - id: FW-ADM-008
    title: Single-CPU high usage logging
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: flag_enabled
    params:
      default:
        field: log_single_cpu_high
    mitigation:
      generic: "Log an event when any single CPU core exceeds the usage threshold."
      fortinet: |
        Log an event when any single CPU core exceeds the usage threshold.
        config system global
            set log-single-cpu-high enable
        end
  - id: FW-ADM-009
    title: Administrator password policy
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings]
    evaluator: password_policy_strong
    params:
      default:
        min_length: 14
        apply_to: [admin-password]
      fortinet:
        apply_to: [admin-password, ipsec-preshared-key]
    mitigation:
      generic: "Enable a password policy with minimum length 14 for administrator passwords."
      fortinet: |
        Enable a password policy with minimum length 14 for administrator passwords.
        config system password-policy
            set status enable
            set apply-to admin-password ipsec-preshared-key
            set minimum-length 14
        end
      mikrotik: |
        Set a minimum administrator password length of 14.
        /user settings/set minimum-password-length=14
  - id: FW-ADM-010
    title: Administrator lockout
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: lockout_configured
    params:
      default:
        max_threshold: 3
        max_duration: 900
    mitigation:
      generic: "Lock an admin source after at most 3 failures for at most 900 seconds."
      fortinet: |
        Lock an admin source after at most 3 failures for at most 900 seconds.
        config system global
            set admin-lockout-threshold 3
            set admin-lockout-duration 900
        end
  - id: FW-ADM-011
    title: Administrative HTTP/HTTPS ports
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings]
    evaluator: admin_ports_changed
    params:
      default:
        forbidden_http: 80
        forbidden_https: 443
    mitigation:
      generic: "Move administrative HTTP/HTTPS off 80/443 and disable HTTP-to-HTTPS redirect that still binds 80."
      fortinet: |
        Move administrative HTTP/HTTPS off 80/443 and disable HTTP-to-HTTPS redirect. Avoid 8080, 8081, 4433, and 10443.
        config system global
            set admin-https-redirect disable
            set admin-port <http-port>
            set admin-sport <https-port>
        end
      mikrotik: |
        Move www and www-ssl off 80/443.
        /ip service/set [find name=www] port=<http-port>
        /ip service/set [find name=www-ssl] port=<https-port>
  - id: FW-SVC-001
    title: Insecure management services
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [services]
    evaluator: insecure_services_disabled
    params:
      default: {}
    mitigation:
      generic: "Disable telnet, ftp, and cleartext HTTP management services."
      fortinet: |
        Allow only encrypted administrative access. Do not include http or telnet.
        config system interface
            edit <interface>
            set allowaccess ssh https ping snmp
        end
  - id: FW-SVC-002
    title: Management service listen scope
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [services]
    evaluator: services_not_unrestricted
    params:
      default: {}
    mitigation:
      generic: "Restrict management services to trusted addresses or interfaces."
      fortinet: |
        Restrict each administrator to trusted hosts. Do not use 0.0.0.0/0.
        config system admin
            edit <admin>
            set trusthost1 <network> <mask>
        end
  - id: FW-SVC-003
    title: WAN management services
    severity: high
    applies_to: [fortinet]
    needs: [services]
    evaluator: wan_mgmt_disabled
    params:
      default: {}
    mitigation:
      generic: "Disable administrative access on WAN interfaces."
      fortinet: |
        Disable administrative access on each WAN interface. Manage the device from a dedicated interface.
        config system interface
            edit <wan-interface>
            unselect allowaccess ping https ssh snmp http radius-acct
        end
  - id: FW-SVC-004
    title: Auxiliary services
    severity: low
    applies_to: [mikrotik]
    needs: [services]
    evaluator: named_services_disabled
    params:
      default:
        names: [bandwidth-server, proxy, socks, upnp, cloud-ddns, cloud-update-time]
    mitigation:
      generic: "Disable bandwidth-server, proxy, SOCKS, UPnP, and MikroTik cloud extras."
      mikrotik: |
        Disable production extras that are off in a default hardening.
        /tool bandwidth-server/set enabled=no
        /ip proxy/set enabled=no
        /ip socks/set enabled=no
        /ip upnp/set enabled=no
        /ip cloud/set ddns-enabled=no update-time=no
  - id: FW-SVC-005
    title: SSH strong crypto
    severity: medium
    applies_to: [mikrotik]
    needs: [admin_settings]
    evaluator: flag_enabled
    params:
      default:
        field: ssh_strong_crypto
    mitigation:
      generic: "Enable strict SSH crypto (modern ciphers, no SHA1)."
      mikrotik: |
        Enable strong SSH crypto.
        /ip ssh/set strong-crypto=yes
  - id: FW-L2-001
    title: Neighbor discovery
    severity: low
    applies_to: [mikrotik]
    needs: [l2_access]
    evaluator: l2_surfaces_closed
    params:
      default:
        lists: [discover_interface_list]
    mitigation:
      generic: "Disable neighbor discovery on all interfaces."
      mikrotik: |
        Disable MNDP/CDP/LLDP announcements.
        /ip neighbor discovery-settings/set discover-interface-list=none
  - id: FW-L2-002
    title: MAC management access
    severity: high
    applies_to: [mikrotik]
    needs: [l2_access]
    evaluator: l2_surfaces_closed
    params:
      default:
        lists: [mac_telnet_interface_list, mac_winbox_interface_list]
        flags_off: [mac_ping_enabled]
    mitigation:
      generic: "Disable MAC Telnet, MAC Winbox, and MAC ping."
      mikrotik: |
        Close Layer-2 management that bypasses the IP filter.
        /tool mac-server/set allowed-interface-list=none
        /tool mac-server mac-winbox/set allowed-interface-list=none
        /tool mac-server ping/set enabled=no
  - id: FW-VPN-001
    title: PPTP server
    severity: high
    applies_to: [mikrotik]
    needs: [services]
    evaluator: named_services_disabled
    params:
      default:
        names: [pptp]
    mitigation:
      generic: "Disable the PPTP server. MikroTik does not recommend PPTP."
      mikrotik: |
        Disable the PPTP server. Prefer WireGuard or another current VPN.
        /interface pptp-server server/set enabled=no
  - id: FW-NET-001
    title: Intra-zone traffic
    severity: medium
    applies_to: [fortinet]
    needs: [zones]
    evaluator: intrazone_denied
    params:
      default: {}
    mitigation:
      generic: "Do not allow unrestricted traffic between interfaces in the same zone."
      fortinet: |
        Block intra-zone traffic on each zone.
        config system zone
            edit <zone>
            set intrazone deny
        end
  - id: FW-NTP-001
    title: NTP servers
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [ntp]
    evaluator: ntp_configured
    params:
      default: {}
    mitigation:
      generic: "Enable NTP and point it at trusted time servers."
      fortinet: |
        Enable NTP and point it at trusted time servers.
        config system ntp
            set ntpsync enable
            set type custom
            config ntpserver
                edit 1
                    set server <ntp-server>
                next
            end
        end
  - id: FW-DNS-001
    title: DNS servers
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [dns]
    evaluator: dns_configured
    params:
      default: {}
    mitigation:
      generic: "Configure explicit DNS servers, preferably internal."
      fortinet: |
        Configure explicit DNS servers, preferably internal or otherwise trusted.
        config system dns
            set primary <ip>
            set secondary <ip>
        end
  - id: FW-LOG-001
    title: Local logging
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [logging]
    evaluator: local_logging_enabled
    params:
      default: {}
    mitigation:
      generic: "Enable local logging so administrative actions are recorded on-box."
  - id: FW-LOG-002
    title: Remote syslog
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [logging]
    evaluator: remote_syslog_configured
    params:
      default: {}
    mitigation:
      generic: "Send logs to a remote syslog collector that you control."
      mikrotik: |
        Create a remote logging action with a real collector, then a rule that uses it.
        /system logging action/set [find name=remote] remote=<syslog-host>
        /system logging/add topics=info action=remote
  - id: FW-LOG-003
    title: Remote syslog encryption
    severity: medium
    applies_to: [fortinet]
    needs: [logging]
    evaluator: syslog_encrypted
    params:
      default: {}
    mitigation:
      generic: "Encrypt remote syslog with a reliable transport and high-strength algorithm, or disable remote syslog."
      fortinet: |
        Encrypt remote syslog with a reliable transport and high-strength algorithm.
        config log syslogd setting
            set reliable enable
            set enc-algorithm high
        end
  - id: FW-LOG-004
    title: FortiAnalyzer log encryption
    severity: medium
    applies_to: [fortinet]
    needs: [logging]
    evaluator: faz_encrypted
    params:
      default: {}
    mitigation:
      generic: "Encrypt FortiAnalyzer/FortiManager log shipping with a reliable transport and high-strength algorithm, or disable FAZ logging."
      fortinet: |
        Encrypt FortiAnalyzer or FortiManager log shipping with a reliable transport and high-strength algorithm.
        config log fortianalyzer setting
            set reliable enable
            set enc-algorithm high
        end
  - id: FW-SNMP-001
    title: Default SNMP communities
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [snmp]
    evaluator: no_default_snmp_community
    params:
      default:
        forbidden: [public, private]
      mikrotik:
        require_read_access: true
    mitigation:
      generic: "Remove public/private communities. Prefer SNMPv3 or disable SNMP."
      fortinet: |
        Remove default SNMPv1/v2c communities. Prefer SNMPv3 or disable SNMP.
        config system snmp community
            delete <community-id>
        end
  - id: FW-SNMP-002
    title: SNMP protocol version
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [snmp]
    evaluator: snmp_not_legacy
    params:
      default: {}
      mikrotik:
        legacy_versions: [none]
      fortinet:
        require_v3_user: true
    mitigation:
      generic: "Disable SNMP if unused, or configure SNMPv3 only."
      fortinet: |
        Disable SNMP, or remove v1/v2c communities and add at least one SNMPv3 user with auth-priv.
        config system snmp sysinfo
            set status enable
        end
        config system snmp user
            edit <name>
            set security-level auth-priv
            set auth-proto sha256
            set priv-proto aes256
        end
  - id: FW-SNMP-003
    title: SNMP memory trap thresholds
    severity: medium
    applies_to: [fortinet]
    needs: [snmp]
    evaluator: snmp_memory_traps
    params:
      default: {}
    mitigation:
      generic: "When SNMP is enabled, set free-memory and freeable-memory trap thresholds above zero."
      fortinet: |
        When SNMP is enabled, set memory trap thresholds (CIS example: 20 and 50).
        config system snmp sysinfo
            set trap-free-memory-threshold 20
            set trap-freeable-memory-threshold 50
        end
  - id: FW-POL-001
    title: Unrestricted accept policies
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [firewall_filter]
    evaluator: no_any_any_accept
    params:
      default: {}
      mikrotik:
        skip_established: true
        skip_interface_scoped: true
    mitigation:
      generic: "Remove or tighten any accept rule that allows any source, destination, and service."
  - id: FW-POL-002
    title: Explicit deny policy
    severity: high
    applies_to: [mikrotik]
    needs: [firewall_filter]
    evaluator: explicit_deny_present
    params:
      default:
        chains: [input, forward]
        unrestricted_only: true
    mitigation:
      generic: "Add a final drop/deny rule so unmatched traffic is explicitly denied."
      mikrotik: |
        Add a last drop on input and forward.
        /ip firewall filter/add chain=input action=drop
        /ip firewall filter/add chain=forward action=drop
  - id: FW-POL-003
    title: Policy service selection
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [firewall_filter]
    evaluator: no_unrestricted_service
    params:
      default: {}
      mikrotik:
        actions: [accept]
        skip_established: true
        skip_interface_scoped: true
      fortinet:
        actions: [accept]
    mitigation:
      generic: "Replace unrestricted ALL/any service selections with explicit service objects."
      fortinet: |
        Replace service ALL with the specific services required.
        config firewall policy
            edit <id>
            set service "<svc1>" "<svc2>"
        end
      mikrotik: |
        Restrict a specific accept rule to an explicit protocol and destination port. Leave the final drop as any.
        /ip firewall filter/set [find comment=mgmt] protocol=tcp dst-port=22,443
  - id: FW-POL-004
    title: ISDB deny policies
    severity: high
    applies_to: [fortinet]
    needs: [firewall_filter]
    evaluator: isdb_denies_present
    params:
      default: {}
    mitigation:
      generic: "Add deny policies that cover the required inbound and outbound Internet Service Database entries."
      fortinet: |
        Add enabled deny policies for the inbound and outbound ISDB sets.
        config firewall policy
            edit <inbound-id>
            set srcintf any
            set dstintf any
            set internet-service-src enable
            set internet-service-src-name "Tor-Exit.Node" "Tor-Relay.Node" "Censys-Scanner" "Shodan-Scanner" "Botnet-C&C.Server" "Phishing-Phishing.Server" "Proxy-Proxy.Server" "Spam-Spamming.Server" "VPN-Anonymous.VPN" "Malicious-Malicious.Server"
            set dstaddr all
            set service ALL
            set schedule always
            set action deny
            set logtraffic all
            set status enable
        end
        config firewall policy
            edit <outbound-id>
            set srcintf any
            set dstintf any
            set srcaddr all
            set internet-service enable
            set internet-service-name "Tor-Relay.Node" "Botnet-C&C.Server" "Phishing-Phishing.Server" "Proxy-Proxy.Server" "Spam-Spamming.Server" "VPN-Anonymous.VPN" "Malicious-Malicious.Server"
            set schedule always
            set action deny
            set logtraffic all
            set status enable
        end
  - id: FW-POL-005
    title: Policy logging
    severity: medium
    applies_to: [fortinet]
    needs: [firewall_filter, logging]
    evaluator: policies_logged
    params:
      default: {}
    mitigation:
      generic: "Enable logging on every firewall policy and log the implicit deny."
      fortinet: |
        Enable logging on every firewall policy and log the implicit deny.
        config firewall policy
            edit <id>
            set logtraffic all
        end
        config log setting
            set fwpolicy-implicit-log enable
        end
  - id: FW-LIP-001
    title: Local-in policies
    severity: medium
    applies_to: [fortinet]
    needs: [local_in]
    evaluator: local_in_present
    params:
      default: {}
    mitigation:
      generic: "Add at least one local-in policy."
      fortinet: |
        Add at least one local-in policy.
        config firewall local-in-policy
            edit <id>
            set intf <interface>
            set srcaddr <addr>
            set dstaddr all
            set action deny
            set service <service>
            set schedule always
        end
  - id: FW-LIP-002
    title: Local-in virtual patch
    severity: high
    applies_to: [fortinet]
    needs: [local_in]
    evaluator: virtual_patch_on_accept
    params:
      default: {}
    mitigation:
      generic: "Enable virtual patch on every accept local-in policy."
      fortinet: |
        Enable virtual patch on every accept local-in policy.
        config firewall local-in-policy
            edit <id>
            set virtual-patch enable
        end
  - id: FW-HA-001
    title: HA monitor interfaces
    severity: medium
    applies_to: [fortinet]
    needs: [ha]
    evaluator: ha_monitors_set
    params:
      default: {}
    mitigation:
      generic: "Configure HA monitor interfaces when HA is enabled."
      fortinet: |
        Configure HA monitor interfaces when HA is enabled.
        config system ha
            set monitor <if1> <if2>
        end
  - id: FW-HA-002
    title: HA reserved management
    severity: medium
    applies_to: [fortinet]
    needs: [ha]
    evaluator: ha_reserved_mgmt
    params:
      default: {}
    mitigation:
      generic: "Enable HA reserved management interfaces when HA is enabled."
      fortinet: |
        Enable HA reserved management when HA is enabled.
        config system ha
            set ha-mgmt-status enable
            config ha-mgmt-interfaces
                edit 1
                    set interface <interface>
                    set gateway <gateway>
                next
            end
        end
  - id: FW-UTM-001
    title: IPS sensor on accept policies
    severity: high
    applies_to: [fortinet]
    needs: [firewall_filter]
    evaluator: utm_on_accept
    params:
      default:
        field: ips_sensor
    mitigation:
      generic: "Attach an IPS sensor to every enabled accept policy."
      fortinet: |
        Attach an IPS sensor to every enabled accept policy.
        config firewall policy
            edit <id>
            set ips-sensor <profile>
        end
  - id: FW-UTM-002
    title: DNS filter query logging
    severity: medium
    applies_to: [fortinet]
    needs: [utm]
    evaluator: utm_profile_log_all
    params:
      default:
        kind: dnsfilter
    mitigation:
      generic: "Enable full query logging on at least one DNS filter profile."
      fortinet: |
        Enable full query logging on at least one DNS filter profile.
        config dnsfilter profile
            edit <profile>
            set log-all-domain enable
        end
  - id: FW-UTM-003
    title: DNS filter on accept policies
    severity: high
    applies_to: [fortinet]
    needs: [firewall_filter]
    evaluator: utm_on_accept
    params:
      default:
        field: dnsfilter_profile
    mitigation:
      generic: "Attach a DNS filter profile to every enabled accept policy."
      fortinet: |
        Attach a DNS filter profile to every enabled accept policy.
        config firewall policy
            edit <id>
            set dnsfilter-profile <profile>
        end
  - id: FW-UTM-004
    title: Web filter categories
    severity: high
    applies_to: [fortinet]
    needs: [utm]
    evaluator: utm_profile_blocks
    params:
      default:
        kind: webfilter
    mitigation:
      generic: "Block malicious, phishing, and spam web categories in at least one web filter profile."
      fortinet: |
        Block Malicious Websites, Phishing, and Spam URLs in at least one web filter profile.
        config webfilter profile
            edit <profile>
            config ftgd-wf
                config filters
                    edit 1
                        set category 26
                        set action block
                    next
                    edit 2
                        set category 61
                        set action block
                    next
                    edit 3
                        set category 86
                        set action block
                    next
                end
            end
        end
  - id: FW-UTM-005
    title: Application control categories
    severity: high
    applies_to: [fortinet]
    needs: [utm]
    evaluator: utm_profile_blocks
    params:
      default:
        kind: appctrl
    mitigation:
      generic: "Block P2P and proxy application categories in at least one application control profile."
      fortinet: |
        Block the P2P and Proxy application categories.
        config application list
            edit <profile>
            config entries
                edit 1
                    set category 2
                    set action block
                next
                edit 2
                    set category 6
                    set action block
                next
            end
        end
  - id: FW-UTM-006
    title: Application control allow categories
    severity: high
    applies_to: [fortinet]
    needs: [utm]
    evaluator: utm_profile_no_allow
    params:
      default:
        kind: appctrl
    mitigation:
      generic: "Do not set application-control categories to Allow; use monitor or block."
      fortinet: |
        Change any application-control category Action Allow to Monitor.
        config application list
            edit <profile>
            config entries
                edit <id>
                    set action monitor
                next
            end
        end
  - id: FW-UTM-007
    title: Application control on accept policies
    severity: high
    applies_to: [fortinet]
    needs: [firewall_filter]
    evaluator: utm_on_accept
    params:
      default:
        field: application_list
    mitigation:
      generic: "Attach an application control profile to every enabled accept policy."
