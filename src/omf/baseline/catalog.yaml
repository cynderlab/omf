checks:
  - id: FW-ADM-001
    title: No generic default admin username
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [users]
    evaluator: no_generic_accounts
    params:
      default:
        names: [admin, administrator, root]
      mikrotik:
        names: [admin]
        mode: must_not_exist
      fortinet:
        names: [admin]
        mode: must_be_renamed
    mitigation:
      generic: "Replace factory-default admin identities with unique named accounts."
      mikrotik: "Rename the default admin user under /user so the name is no longer admin."
      fortinet: "Rename the default admin administrator. FortiOS does not allow deleting it."
  - id: FW-ADM-002
    title: Admin idle timeout is set
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings]
    evaluator: idle_timeout_set
    params:
      default: {}
      fortinet:
        max_seconds: 900
    mitigation:
      generic: "Configure a non-zero administrative idle timeout."
      fortinet: "In config system global, set admintimeout to 15 minutes or less."
  - id: FW-ADM-003
    title: Device identity is not the factory default
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [admin_settings]
    evaluator: hostname_not_default
    params:
      default: {}
    mitigation:
      generic: "Set a unique hostname that identifies the device and site."
  - id: FW-ADM-004
    title: Pre-login banner is enabled
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: banner_enabled
    params:
      default:
        field: pre_login_banner
    mitigation:
      generic: "Enable a pre-login legal banner on the administrative login page."
      fortinet: "In config system global, set pre-login-banner enable. Edit the pre-login replacement message so it is a warning, not a welcome."
  - id: FW-ADM-005
    title: Post-login banner is enabled
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: banner_enabled
    params:
      default:
        field: post_login_banner
    mitigation:
      generic: "Enable a post-login banner that the administrator must acknowledge."
      fortinet: "In config system global, set post-login-banner enable."
  - id: FW-ADM-006
    title: Timezone is configured
    severity: low
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: timezone_set
    params:
      default: {}
    mitigation:
      generic: "Set the device timezone to the site local zone so logs and certificates line up."
      fortinet: "In config system global, set timezone to the site zone id."
  - id: FW-ADM-007
    title: Management GUI uses TLS 1.3 only
    severity: high
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: tls_versions_allowed
    params:
      default:
        allowed: [tlsv1-3]
    mitigation:
      generic: "Restrict the administrative HTTPS listener to TLS 1.3."
      fortinet: "In config system global, set admin-https-ssl-versions tlsv1-3."
  - id: FW-ADM-008
    title: Single CPU core high usage is logged
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: flag_enabled
    params:
      default:
        field: log_single_cpu_high
    mitigation:
      generic: "Log an event when any single CPU core exceeds the usage threshold."
      fortinet: "In config system global, set log-single-cpu-high enable."
  - id: FW-ADM-009
    title: Administrator password policy meets length 14
    severity: high
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: password_policy_strong
    params:
      default:
        min_length: 14
        apply_to: [admin-password]
    mitigation:
      generic: "Enable a password policy with minimum length 14 for administrator passwords."
      fortinet: "In config system password-policy, set status enable, apply-to admin-password, and minimum-length 14."
  - id: FW-ADM-010
    title: Administrator lockout threshold and duration are bounded
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: lockout_configured
    params:
      default:
        max_threshold: 3
        max_duration: 900
    mitigation:
      generic: "Lock an admin source after at most 3 failures for at most 900 seconds."
      fortinet: "In config system global, set admin-lockout-threshold 3 and admin-lockout-duration 900."
  - id: FW-ADM-011
    title: Default administrative HTTP and HTTPS ports are changed
    severity: medium
    applies_to: [fortinet]
    needs: [admin_settings]
    evaluator: admin_ports_changed
    params:
      default:
        forbidden_http: 80
        forbidden_https: 443
    mitigation:
      generic: "Move administrative HTTP/HTTPS off 80/443 and disable HTTP-to-HTTPS redirect that still binds 80."
      fortinet: "In config system global, set admin-https-redirect disable, set admin-port to a non-80 port, and set admin-sport to a non-443 port. Avoid 8080, 8081, 4433, and 10443."
  - id: FW-SVC-001
    title: Insecure management services are disabled
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [services]
    evaluator: insecure_services_disabled
    params:
      default: {}
    mitigation:
      generic: "Disable telnet, ftp, and cleartext HTTP management services."
  - id: FW-SVC-002
    title: Management services are not open to all
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [services]
    evaluator: services_not_unrestricted
    params:
      default: {}
    mitigation:
      generic: "Restrict management services to trusted addresses or interfaces."
  - id: FW-SVC-003
    title: WAN interfaces have no management services
    severity: high
    applies_to: [fortinet]
    needs: [services]
    evaluator: wan_mgmt_disabled
    params:
      default: {}
    mitigation:
      generic: "Disable administrative access on WAN interfaces."
      fortinet: "On each WAN interface, unselect allowaccess for ping, https, http, ssh, snmp, and radius-acct. Manage the device from a dedicated interface."
  - id: FW-NET-001
    title: Intra-zone traffic is denied
    severity: medium
    applies_to: [fortinet]
    needs: [zones]
    evaluator: intrazone_denied
    params:
      default: {}
    mitigation:
      generic: "Do not allow unrestricted traffic between interfaces in the same zone."
      fortinet: "In config system zone, set intrazone deny on each zone (GUI: Block intra-zone traffic)."
  - id: FW-NTP-001
    title: NTP is enabled with at least one server
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [ntp]
    evaluator: ntp_configured
    params:
      default: {}
    mitigation:
      generic: "Enable NTP and point it at trusted time servers."
  - id: FW-DNS-001
    title: DNS servers are configured
    severity: low
    applies_to: [mikrotik, fortinet]
    needs: [dns]
    evaluator: dns_configured
    params:
      default: {}
    mitigation:
      generic: "Configure explicit DNS servers, preferably internal."
  - id: FW-LOG-001
    title: Local logging is enabled
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [logging]
    evaluator: local_logging_enabled
    params:
      default: {}
    mitigation:
      generic: "Enable local logging so administrative actions are recorded on-box."
  - id: FW-LOG-002
    title: Remote syslog is configured
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [logging]
    evaluator: remote_syslog_configured
    params:
      default: {}
    mitigation:
      generic: "Send logs to a remote syslog collector that you control."
  - id: FW-LOG-003
    title: Remote syslog uses reliable high encryption
    severity: medium
    applies_to: [fortinet]
    needs: [logging]
    evaluator: syslog_encrypted
    params:
      default: {}
    mitigation:
      generic: "Encrypt remote syslog with a reliable transport and high-strength algorithm, or disable remote syslog."
      fortinet: "In config log syslogd setting, set status enable, set reliable enable, and set enc-algorithm high."
  - id: FW-LOG-004
    title: FortiAnalyzer logging uses reliable high encryption
    severity: medium
    applies_to: [fortinet]
    needs: [logging]
    evaluator: faz_encrypted
    params:
      default: {}
    mitigation:
      generic: "Encrypt FortiAnalyzer/FortiManager log shipping with a reliable transport and high-strength algorithm, or disable FAZ logging."
      fortinet: "In config log fortianalyzer setting, set status enable, set reliable enable, and set enc-algorithm high."
  - id: FW-SNMP-001
    title: No default SNMP community
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [snmp]
    evaluator: no_default_snmp_community
    params:
      default:
        forbidden: [public, private]
    mitigation:
      generic: "Remove public/private communities. Prefer SNMPv3 or disable SNMP."
  - id: FW-SNMP-002
    title: SNMP is disabled or uses v3-only communities
    severity: medium
    applies_to: [mikrotik, fortinet]
    needs: [snmp]
    evaluator: snmp_not_legacy
    params:
      default: {}
      fortinet:
        require_v3_user: true
    mitigation:
      generic: "Disable SNMP if unused, or configure SNMPv3 only."
      fortinet: "Disable SNMP, or remove v1/v2c communities and configure at least one SNMPv3 user under config system snmp user."
  - id: FW-SNMP-003
    title: SNMP memory trap thresholds are configured
    severity: medium
    applies_to: [fortinet]
    needs: [snmp]
    evaluator: snmp_memory_traps
    params:
      default: {}
    mitigation:
      generic: "When SNMP is enabled, set free-memory and freeable-memory trap thresholds above zero."
      fortinet: "In config system snmp sysinfo, set trap-free-memory-threshold and trap-freeable-memory-threshold to values greater than 0."
  - id: FW-POL-001
    title: No unrestricted accept policy
    severity: high
    applies_to: [mikrotik, fortinet]
    needs: [firewall_filter]
    evaluator: no_any_any_accept
    params:
      default: {}
    mitigation:
      generic: "Remove or tighten any accept rule that allows any source, destination, and service."
  - id: FW-POL-002
    title: Explicit deny is present
    severity: medium
    applies_to: [mikrotik]
    needs: [firewall_filter]
    evaluator: explicit_deny_present
    params:
      default: {}
    mitigation:
      generic: "Add a final drop/deny rule so unmatched traffic is explicitly denied."
      mikrotik: "Add a last /ip/firewall/filter rule with action=drop."
  - id: FW-POL-003
    title: Policies do not use ALL as service
    severity: high
    applies_to: [fortinet]
    needs: [firewall_filter]
    evaluator: no_unrestricted_service
    params:
      default: {}
    mitigation:
      generic: "Replace unrestricted ALL/any service selections with explicit service objects."
      fortinet: "In each firewall policy, replace service ALL with the specific services required."
  - id: FW-POL-004
    title: ISDB deny policies cover Tor and malicious services
    severity: high
    applies_to: [fortinet]
    needs: [firewall_filter]
    evaluator: isdb_denies_present
    params:
      default: {}
    mitigation:
      generic: "Add deny policies that cover the required inbound and outbound Internet Service Database entries."
      fortinet: "Create enabled deny policies whose internet-service-src and internet-service destinations cover the CIS 7.4.5 ISDB name sets."
  - id: FW-POL-005
    title: Logging is enabled on policies and implicit deny
    severity: medium
    applies_to: [fortinet]
    needs: [firewall_filter, logging]
    evaluator: policies_logged
    params:
      default: {}
    mitigation:
      generic: "Enable logging on every firewall policy and log the implicit deny."
      fortinet: "Set logtraffic all on each policy, and in config log setting set fwpolicy-implicit-log enable."
  - id: FW-LIP-001
    title: Local-in policies are present
    severity: medium
    applies_to: [fortinet]
    needs: [local_in]
    evaluator: local_in_present
    params:
      default: {}
    mitigation:
      generic: "Add at least one local-in policy."
      fortinet: "In config firewall local-in-policy, add at least one enabled local-in policy."
  - id: FW-LIP-002
    title: Virtual patch is enabled on accept local-in policies
    severity: high
    applies_to: [fortinet]
    needs: [local_in]
    evaluator: virtual_patch_on_accept
    params:
      default: {}
    mitigation:
      generic: "Enable virtual patch on every accept local-in policy."
      fortinet: "On every accept local-in policy, set virtual-patch enable."
  - id: FW-SYS-001
    title: Firmware version is recorded
    severity: info
    applies_to: [mikrotik, fortinet]
    needs: [system_info]
    evaluator: firmware_present
    params:
      default: {}
    mitigation:
      generic: "Record the firmware version and compare it to the vendor advisory feed offline."
